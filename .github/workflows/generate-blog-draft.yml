name: Generate blog draft

on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    if: ${{ secrets.OPENAI_API_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate article draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/generate-blog-draft.mjs
      - name: Create review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/blog-draft
          delete-branch: true
          title: "Draft: new SJ construction insight"
          commit-message: "Generate blog article draft"
          body: |
            This article was generated as a draft. Review all facts, local applicability, claims, links and wording before merging.
